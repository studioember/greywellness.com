name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `yarn build` ends with `yarn test:forms`, which validates every rendered
      # form against the live Google Form. It runs before the artifact upload, so
      # a broken form blocks the deploy. FORMS_STRICT makes an unreachable form a
      # failure rather than a skip — locally it stays a warning so offline builds
      # still work.
      - name: Build
        run: yarn build
        env:
          FORMS_STRICT: '1'
        #   ELEVENTY_PATH_PREFIX: /greywellness.com/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
